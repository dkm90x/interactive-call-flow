nt-weight:650}.bridges p{margin-top:8px;font-size:13px}.status-bar{margin-top:18px;font-size:11px;color:var(--muted)}.setup-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px}.setup-nav{display:grid;gap:5px;position:sticky;top:15px}.setup-nav button{text-align:left;background:transparent;border-color:transparent}.setup-nav button[aria-current=page]{background:var(--soft);color:var(--accent);border-color:var(--line)}.editor-card{padding:18px;border:1px solid var(--line);border-radius:10px;margin:14px 0;background:#fff}.editor-card .editor-card{background:#f8f9f6}.editor-header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.editor-actions{display:flex;gap:4px;flex:none}.editor-actions button{padding:3px 8px;font-size:11px}.stack{display:grid;gap:12px}.inline-fields{display:grid;grid-template-columns:1fr 160px;gap:10px}.editor-note{margin:12px 0 18px}.setup-toolbar{position:sticky;bottom:0;background:#f5f4eff5;border-top:1px solid var(--line);padding:13px 0;margin-top:20px;display:flex;justify-content:space-between;gap:12px}.error{color:#a03e36;background:#fff0ee;padding:12px;border-radius:8px;margin:10px 0}.welcome{max-width:980px;margin:45px auto;padding:0 24px}.welcome h1{font-size:38px;max-width:650px;margin:12px 0 18px}.welcome>p{max-width:660px;color:var(--muted);font-size:16px}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.template-card{display:flex;flex-direction:column;gap:13px}.template-card p{font-size:13px;color:var(--muted);flex:1}.welcome-foot{font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;max-width:520px;width:calc(100% - 30px);padding:25px;color:var(--ink);background:white}dialog::backdrop{background:#172b23aa}dialog p{margin:13px 0 20px;font-size:14px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#223c30;color:white;border-radius:8px;padding:10px 16px;font-size:12px;z-index:10;display:none}#toast.visible{display:block}.check-row{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px}.setup-help{padding:14px;background:var(--soft);border-radius:8px;font-size:12px;color:var(--muted)}.copy-button{font-size:11px;padding:4px 8px}.mobile-brief{display:none}.saved{color:var(--accent)}

<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>const VERSION=2;
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
const clone=x=>JSON.parse(JSON.stringify(x));
function newCall(config){return {customer:'',agent:'',phone:'',reason:'',notes:'',fields:{},selected:[],topic:config.topics[0]?.id||'',question:0,offer:'',callType:config.callTypes[0]?.id||'',currentCost:'',unitCost:'',quantity:'1',started:new Date().toISOString()};}
function costComparison(call){const valid=v=>typeof v==='string'&&v.trim()!==''&&Number.isFinite(Number(v));if(![call.currentCost,call.unitCost,call.quantity].every(valid))return null;const current=Number(call.currentCost),unit=Number(call.unitCost),quantity=Number(call.quantity);if(current<0||unit<0||quantity<=0)return null;const proposed=Math.round(unit*quantity*100)/100;return {current,proposed,savings:Math.round((current-proposed)*100)/100};}
function fill(text,call,config,offer){const values={customer:call.customer||'your customer',agent:call.agent||'your name',business:config.business,offer:offer?.name||'this option'};return String(text||'').replace(/\{(customer|agent|business|offer)\}/g,(_,key)=>values[key]);}
function options(config){return config.topics.flatMap(topic=>topic.options.map(option=>({...option,topic:topic.name})));}
function brief(config,call){const selected=new Set(call.selected);return options(config).filter(option=>selected.has(option.id));}
function spokenReason(text){const t=text.trim();for(const [from,to]of [['Wants ','you want '],['Likes ','you like '],['Dislikes ','you dislike '],['Has ','you have '],['Needs ','you need '],['Uses ','you use '],['Works ','you work '],['Mostly watches ','you mostly watch '],['Often parks ','you often park ']])if(t.startsWith(from))return to+t.slice(from.length);return t.charAt(0).toLowerCase()+t.slice(1);}
function tiebacks(config,call,offer){const selected=new Map(brief(config,call).map(o=>[o.id,o]));return offer.tiebacks.filter(t=>selected.has(t.optionId)&&t.feature.trim()&&t.benefit.trim()).map(t=>({...t,option:selected.get(t.optionId),sentence:`Because you said ${t.reason.trim()||spokenReason(selected.get(t.optionId).label)}, ${offer.name} gives you ${t.feature}, so ${t.benefit}.`}));}
function rankOffers(config,call){return config.offers.map(offer=>({offer,matches:tiebacks(config,call,offer).length})).sort((a,b)=>b.matches-a.matches);}
function presentation(config,call){const offer=config.offers.find(o=>o.id===call.offer);if(!offer)return null;const lines=tiebacks(config,call,offer);const covered=new Set(lines.map(t=>t.optionId));return {offer,lines,uncovered:brief(config,call).filter(o=>!covered.has(o.id))};}
function callSummary(config,call){const p=presentation(config,call);return [config.name,`Customer: ${call.customer||'Not entered'}`,`Agent: ${call.agent||'Not entered'}`,`Phone: ${call.phone||'Not entered'}`,`Reason: ${call.reason||'Not entered'}`,...config.fields.map(f=>`${f.label}: ${call.fields[f.id]||'Not entered'}`),'','DISCOVERY',...brief(config,call).map(o=>`- [${o.kind}] ${o.topic}: ${o.label}`),'',p?`RECOMMENDATION: ${p.offer.name}`:'No recommendation selected',...(p?.lines.map(t=>t.sentence)||[]),...(p?.uncovered.length?['Still to confirm:',...p.uncovered.map(o=>`- ${o.label}`)]:[]),'',...(costComparison(call)?[`COST COMPARISON (${config.costBasis||'same period / basis'})`,`Current: ${costComparison(call).current.toFixed(2)}`,`Proposed: ${costComparison(call).proposed.toFixed(2)}`,`Difference: ${costComparison(call).savings.toFixed(2)}`]:[]),'',`Notes: ${call.notes||''}`].join('\n');}
function validate(config){
 const errors=[];const nonempty=x=>typeof x==='string'&&x.trim().length>0;const unique=arr=>new Set(arr.map(x=>x.id)).size===arr.length;
 if(!config||config.version!==VERSION)throw Error('This file is not a version 2 call-flow template.');
 if(!nonempty(config.name)||!nonempty(config.business))errors.push('Give the flow and business a name.');
 for(const key of ['stages','callTypes','topics','offers','bridges','fields']){if(!Array.isArray(config[key]))errors.push(`Missing ${key}.`);else if(!unique(config[key])||config[key].some(x=>!nonempty(x.id)))errors.push(`${key} need unique identifiers.`);}
 if(errors.length)throw Error(errors.join(' '));
 if(!config.stages.length||!config.callTypes.length||!config.topics.length||!config.offers.length)errors.push('Keep at least one stage, call type, category, and offer.');
 for(const stage of config.stages){if(!nonempty(stage.name)||!['script','agenda','discovery','presentation'].includes(stage.type)||typeof stage.script!=='string'||typeof stage.transition!=='string')errors.push('Each stage needs a name, valid type, script, and transition.');}
 for(const type of ['discovery','presentation'])if(!config.stages.some(s=>s.type===type))errors.push(`Keep a ${type} stage.`);
 for(const ct of config.callTypes)if(!nonempty(ct.name)||typeof ct.transition!=='string')errors.push('Call types need names and transition statements.');
 const ids=[];
 for(const topic of config.topics){if(!nonempty(topic.name)||!Array.isArray(topic.questions)||!topic.questions.length||topic.questions.some(q=>!nonempty(q))||!Array.isArray(topic.options)||!topic.options.length)errors.push('Every category needs a name, a question, and an answer.');else for(const option of topic.options){ids.push(option.id);if(!nonempty(option.id)||!nonempty(option.label)||!['want','like','dislike','fact'].includes(option.kind))errors.push('Answers need a label and a valid type.');}}
 if(new Set(ids).size!==ids.length)errors.push('Answer identifiers must be unique.');
 const known=new Set(ids);
 for(const offer of config.offers){if(!nonempty(offer.name)||typeof offer.group!=='string'||typeof offer.description!=='string'||!Array.isArray(offer.tiebacks))errors.push('Offers need a name, category, description, and tiebacks.');else {if(new Set(offer.tiebacks.map(t=>t.optionId)).size!==offer.tiebacks.length)errors.push('Keep one tieback per answer in each offer.');for(const t of offer.tiebacks)if(!known.has(t.optionId)||typeof t.reason!=='string'||typeof t.feature!=='string'||typeof t.benefit!=='string')errors.push('A tieback refers to a missing answer or has invalid text.');}}
 for(const b of config.bridges)if(!nonempty(b.name)||!nonempty(b.text))errors.push('Bridges need a label and statement.');
 for(const f of config.fields)if(!nonempty(f.label))errors.push('Call detail fields need labels.');
 if(errors.length)throw Error([...new Set(errors)].join(' '));return true;
}
function removeOption(config,id){for(const topic of config.topics)topic.options=topic.options.filter(o=>o.id!==id);for(const offer of config.offers)offer.tiebacks=offer.tiebacks.filter(t=>t.optionId!==id);}
function restoreCall(config,value){const call={...newCall(config),...value};call.selected=Array.isArray(call.selected)?call.selected.filter(id=>options(config).some(o=>o.id===id)):[];if(!config.stages.some(s=>s.id===call.stage))call.stage=config.stages[0].id;if(!config.topics.some(t=>t.id===call.topic))call.topic=config.topics[0].id;if(!config.callTypes.some(c=>c.id===call.callType))call.callType=config.callTypes[0].id;if(!config.offers.some(o=>o.id===call.offer))call.offer='';call.fields=call.fields&&typeof call.fields==='object'?call.fields:{};return call;}

const stages=()=>[
 {id:'open',name:'Open the call',type:'script',script:'Thanks for calling {business}. My name is {agent}. Who do I have the pleasure of speaking with?\n\nHi {customer}, what can I help you with today?',transition:'I can help with that. Before we get into options, let me make sure I understand what you need.'},
 {id:'agenda',name:'Set the agenda',type:'agenda',script:'Acknowledge the reason for the call, explain the next step, and ask permission to discover.',transition:'I’ll ask a few questions, narrow down the options, and let you decide what makes sense. Does that work for you?'},
 {id:'discovery',name:'Discovery',type:'discovery',script:'Ask, listen, and select what the customer actually says. Capture their own words in the notes.',transition:'That helps. Let me connect what you told me to an option that fits.'},
 {id:'presentation',name:'Presentation',type:'presentation',script:'Based on what you told me, the option I would recommend is {offer}.',transition:'How does that line up with what you had in mind? What would you like me to clarify?'},
 {id:'close',name:'Agree on next steps',type:'script',script:'What questions do you still have, {customer}?\n\nLet’s agree on the next step and the best way to follow up.',transition:'Before we wrap up, let me recap what we decided and what happens next.'}
];
const bridges=()=>[
 {id:'bridge-ack',name:'Acknowledge & redirect',text:'Absolutely, we can take care of that. The next thing I need to understand is…'},
 {id:'bridge-park',name:'Park a question',text:'Good question. I’ve made a note of it, and we’ll come back to it. First, let’s…'},
 {id:'bridge-clarify',name:'Go a little deeper',text:'Help me understand that a little better. What matters most about that for you?'},
 {id:'bridge-check',name:'Check understanding',text:'Let me make sure I have this right. You’re looking for… Is that accurate?'}
];
const opt=(id,label,kind='want')=>({id,label,kind});
const tie=(optionId,feature,benefit,reason='')=>({optionId,feature,benefit,reason});
const common=(name,business)=>({version:2,name,business,stages:stages(),bridges:bridges(),callTypes:[{id:'new',name:'New inquiry',transition:'No problem, {customer}. I’ll ask a few questions about what matters to you, then we can look at the options together. You can decide what makes sense.'},{id:'change',name:'Replace / change',transition:'We can work through that. Let’s start with what works today and what you would change, so the next option is a better fit.'},{id:'follow',name:'Follow-up',transition:'Glad we could reconnect. Before we pick up where we left off, has anything changed about what you’re looking for?'}],fields:[],topics:[],offers:[]});
function dealership(){const c=common('Dealership inbound calls','Northside Motors · example');
 c.fields=[{id:'vehicle',label:'Currently driving'},{id:'budget',label:'Budget / price range'},{id:'timing',label:'Purchase timeline'}];
 c.topics=[
  {id:'current',name:'Current vehicle',questions:['Tell me what you’re driving now. What do you like about it, and what would you change?','What does your current vehicle make difficult in your day-to-day driving?'],options:[opt('keep-roof','Likes the sunroof in the current vehicle','like'),opt('cloth','Dislikes the current cloth seats','dislike'),opt('road-noise','Dislikes road noise on longer drives','dislike')]},
  {id:'comfort',name:'Seats & comfort',questions:['What kind of seats do you have now? How do they feel on a longer drive?','Would heated seats, easier adjustments, or a different seat material matter to you?'],options:[opt('heated','Wants heated seats'),opt('easy-clean','Wants seats that are easier to clean'),opt('lumbar','Wants more support on long drives')]},
  {id:'features',name:'Features & trim',questions:['Are there features you use all the time or wish your current car had?','How important are a sunroof and phone connectivity to you?'],options:[opt('roof','Wants a sunroof'),opt('phone','Wants easy phone navigation'),opt('parking','Wants help parking in tight spaces')]},
  {id:'usage',name:'Driving & passengers',questions:['Walk me through a normal week of driving. Who usually rides with you?','What do you need room for—people, car seats, equipment, or weekend trips?'],options:[opt('commute','Has a long daily commute','fact'),opt('cargo','Needs room for family gear'),opt('city','Often parks in tight city spaces','fact')]}
 ];
 c.offers=[
  {id:'essential',name:'Example SUV · Essential trim',group:'Vehicles / trims',description:'Fictional training vehicle. Replace this with your actual vehicle, equipment, and availability.',tiebacks:[tie('phone','phone integration','you can use familiar navigation on the vehicle display'),tie('cargo','a flexible rear cargo area','you have room for family gear')]},
  {id:'comfort',name:'Example SUV · Comfort trim',group:'Vehicles / trims',description:'Fictional training option: heated easy-clean seats, adjustable lumbar support, and a sunroof. Confirm real specifications before offering a vehicle.',tiebacks:[tie('heated','heated front seats','you can warm up on cold mornings'),tie('cloth','easy-clean seat material','you can spend less time dealing with spills'),tie('easy-clean','easy-clean seat material','you can wipe up everyday spills more easily'),tie('lumbar','adjustable lumbar support','you can find a more comfortable position on longer drives'),tie('commute','adjustable lumbar support','your daily drive can be more comfortable'),tie('roof','a sunroof','you can bring more light and fresh air into the cabin'),tie('keep-roof','a sunroof','you can keep a feature you already enjoy'),tie('phone','phone integration','you can use familiar navigation on the vehicle display'),tie('cargo','a flexible rear cargo area','you have room for family gear')]},
  {id:'touring',name:'Example SUV · Touring trim',group:'Vehicles / trims',description:'Fictional training option. Adds parking assistance and additional cabin insulation to the example Comfort equipment.',tiebacks:[tie('heated','heated front seats','you can warm up on cold mornings'),tie('roof','a sunroof','you can bring more light into the cabin'),tie('parking','parking assistance','you can judge tight spaces more easily'),tie('city','parking assistance','you have an extra reference when maneuvering into small spaces'),tie('road-noise','additional cabin insulation','you can have a quieter conversation on a longer drive')]}
 ];return c;}
function homeServices(){const c=common('Home connectivity calls','Your connectivity team');
 c.fields=[{id:'address',label:'Service area / address'},{id:'provider',label:'Current provider'},{id:'lines',label:'Household / lines'},{id:'cost',label:'Current monthly cost'}];
 c.topics=[
